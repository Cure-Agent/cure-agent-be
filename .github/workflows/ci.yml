name: CI

on:
  pull_request:
    branches: [dev]
    # labeled/unlabeled가 없으면 아래 openapi-breaking의 `breaking-change-approved` 승인 경로가
    # **선언만 되고 동작하지 않는다** — 라벨을 붙여도 재평가할 계기가 없고, run rerun은 원본
    # 이벤트 payload를 재사용해 라벨 변경을 보지 못한다(PR #153에서 실증).
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:e2e
      - run: pnpm build

  # 런타임 이미지가 실제로 빌드되는지 검증한다 (docs/specs/16 — 레지스트리 푸시는 하지 않는다)
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t cure-agent-be:ci .

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks scan
        uses: docker://ghcr.io/gitleaks/gitleaks:latest
        with:
          args: detect --source=. --redact -v

  # PR에서 OpenAPI breaking change 감지 (architecture.md §1, §13)
  # 스펙 diff=0 검증은 test:e2e의 contract 스펙이 담당한다
  # dev→main 단방향 흐름이라 dev 스펙 기준 검사가 main 기준 검사를 포괄한다
  #
  # 의도된 breaking(인증 방식 전환 등)은 `breaking-change-approved` 라벨로 통과시킨다.
  # 기본은 여전히 차단이며, 예외는 라벨로 PR에 기록이 남는다 — FE 동반 배포가
  # 필요하다는 뜻이므로 라벨을 붙일 때 PR 본문에 그 영향 범위를 함께 적는다.
  openapi-breaking:
    runs-on: ubuntu-latest
    if: "!contains(github.event.pull_request.labels.*.name, 'breaking-change-approved')"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: base 스펙 추출
        id: base
        run: |
          if git show "origin/${{ github.base_ref }}:openapi/cure-agent.v1.json" > /tmp/base.json 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "base 브랜치에 스펙이 없어 breaking 검사를 건너뜁니다"
          fi
      - name: oasdiff breaking
        if: steps.base.outputs.exists == 'true'
        run: |
          docker run --rm \
            -v /tmp/base.json:/base.json:ro \
            -v "$PWD/openapi/cure-agent.v1.json:/rev.json:ro" \
            tufin/oasdiff breaking --fail-on ERR /base.json /rev.json
