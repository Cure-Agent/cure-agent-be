<text x="2354.0" y="515" font-size="30" fill="#111827" font-weight="700" text-anchor="middle">환자·복합 합성</text>
<text x="2232" y="570" font-size="21" fill="#111827" font-weight="600">환자 경로</text>
<text x="2232" y="600" font-size="19" fill="#6B7280">기록만 근거로 전하고</text>
<text x="2232" y="630" font-size="19" fill="#6B7280">가부는 판단하지 않는다</text>
<text x="2232" y="682" font-size="21" fill="#111827" font-weight="600">복합 경로</text>
<text x="2232" y="712" font-size="19" fill="#6B7280">기록 × 지침의 접점만</text>
<line x1="2232" y1="758" x2="2476" y2="758" stroke="#D1D5DB" stroke-width="2"/>
<text x="2232" y="794" font-size="19" fill="#0E9F9F" font-weight="600">agent-patient-v2</text>
<text x="2232" y="824" font-size="18" fill="#6B7280">복합은 판정+본문 구조화로</text>
<text x="2232" y="852" font-size="18" fill="#6B7280">BE 기권 경로에 합류</text>
<text x="56" y="238" font-size="24" fill="#334155" font-weight="700">운영 경로 — 질의 한 건이 지나는 프롬프트</text>
<text x="56" y="922" font-size="24" fill="#334155" font-weight="700">오프라인 — 프롬프트를 고치고, 고칠지 말지를 정하는 프롬프트</text>
<rect x="56" y="950" width="1500" height="400" rx="24" fill="white" filter="url(#sh)"/>
<rect x="56" y="950" width="1500" height="10" rx="5" fill="#D97706"/>
<text x="92" y="1016" font-size="28" fill="#111827" font-weight="700">평가하는 프롬프트</text>
<text x="92" y="1052" font-size="20" fill="#6B7280">생성기와 심판을 같이 바꾸면 전후 비교가 오염된다 — 심판은 따로 서고, 따로 동결한다</text>
<text x="92.0" y="1116" font-size="21" fill="#D97706" font-weight="600">groundedness 심판  ·  BE</text>
<text x="92.0" y="1150" font-size="19" fill="#6B7280">답변을 주장 단위로 갈라</text>
<text x="92.0" y="1180" font-size="19" fill="#6B7280">supported·miscited·unsupported</text>
<text x="92.0" y="1210" font-size="19" fill="#6B7280">면책·한계 고지는 비주장 처리</text>
<text x="92.0" y="1240" font-size="19" fill="#6B7280">루브릭 v3에서 채점 동결</text>
<line x1="544.0" y1="1080" x2="544.0" y2="1254" stroke="#D1D5DB" stroke-width="2"/>
<text x="568.0" y="1116" font-size="21" fill="#D97706" font-weight="600">평가셋 역생성  ·  BE</text>
<text x="568.0" y="1150" font-size="19" fill="#6B7280">답변 가능 문항 · 기권 문항을</text>
<text x="568.0" y="1180" font-size="19" fill="#6B7280">각각 다른 프롬프트로 생성</text>
<text x="568.0" y="1210" font-size="19" fill="#6B7280">앞 회차를 실어 주제 중복 차단</text>
<text x="568.0" y="1240" font-size="19" fill="#6B7280">후보 → 사람 검수 → 승격</text>
<line x1="1020.0" y1="1080" x2="1020.0" y2="1254" stroke="#D1D5DB" stroke-width="2"/>
<text x="1044.0" y="1116" font-size="21" fill="#D97706" font-weight="600">에이전트 평가단  ·  AGENT</text>
<text x="1044.0" y="1150" font-size="19" fill="#6B7280">JUDGE_SYSTEM — 키포인트 채점</text>
<text x="1044.0" y="1180" font-size="19" fill="#6B7280">LABEL_SYSTEM — 근거 청크 라벨링</text>
<text x="1044.0" y="1210" font-size="19" fill="#6B7280">환자·복합 경로 전용 심판 2종</text>
<text x="1044.0" y="1240" font-size="19" fill="#6B7280">등급 규칙은 코드가 강제</text>
<line x1="92" y1="1276" x2="1520" y2="1276" stroke="#D1D5DB" stroke-width="2"/>
<text x="92" y="1312" font-size="19" fill="#111827" font-weight="600">루브릭 보정 → 구·신 교차 채점 → 동결 : 평가 기준 변경과 시스템 변경을 분리한다</text>
<rect x="1604" y="950" width="900" height="400" rx="24" fill="white" filter="url(#sh)"/>
<rect x="1604" y="950" width="900" height="10" rx="5" fill="#334155"/>
<text x="1640" y="1016" font-size="28" fill="#111827" font-weight="700">기각된 프롬프트</text>
<text x="1640" y="1052" font-size="20" fill="#6B7280">에이전틱 RAG 개입 4종 · 5회 반복 ablation</text>
<text x="1640.0" y="1116" font-size="21" fill="#334155" font-weight="600">실험 레포에서만 살아 있다</text>
<text x="1640.0" y="1150" font-size="19" fill="#6B7280">DECOMPOSER — 질의 분해</text>
<text x="1640.0" y="1180" font-size="19" fill="#6B7280">EVALUATOR — 근거 충분성 판정</text>
<text x="1640.0" y="1210" font-size="19" fill="#6B7280">QUERY_GENERATOR — 재검색 질의</text>
<text x="1640.0" y="1240" font-size="19" fill="#6B7280">ANSWERER 축 열거 변형 −0.083</text>
<line x1="1640" y1="1276" x2="2468" y2="1276" stroke="#D1D5DB" stroke-width="2"/>
<text x="1640" y="1312" font-size="19" fill="#111827" font-weight="600">검색 경로는 현행 유지, 생성 게이트만 프로덕션으로 ⑤</text>
<path d="M2054 940 V 928 H 1638.0 V 880" fill="none" stroke="#334155" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#arr_s)"/>
<text x="1664.0" y="918" font-size="19" fill="#334155" font-weight="600">생성 게이트만 프로덕션으로 채택</text>
<text x="56" y="1392" font-size="24" fill="#334155" font-weight="700">프롬프트를 텍스트가 아니라 계약으로 만드는 축</text>
<rect x="56.0" y="1420" width="800.0" height="200" rx="20" fill="white" stroke="#D1D5DB"/>
<rect x="56.0" y="1448" width="6" height="30" rx="3" fill="#334155"/>
<text x="82.0" y="1472" font-size="23" fill="#111827" font-weight="700">버전이 기록에 남는다</text>
<text x="82.0" y="1520" font-size="19" fill="#6B7280">qa-v6 · guidance-v2 · agent-route-v1 · agent-composite-v2가</text>
<text x="82.0" y="1552" font-size="19" fill="#6B7280">GenerationRun에 실려 「왜 이 답이었나」를 재현한다.</text>
<text x="82.0" y="1584" font-size="19" fill="#6B7280">언어가 다르면 규칙 한 줄이 달라 -en으로 따로 잰다.</text>
<rect x="880.0" y="1420" width="800.0" height="200" rx="20" fill="white" stroke="#D1D5DB"/>
<rect x="880.0" y="1448" width="6" height="30" rx="3" fill="#334155"/>
<text x="906.0" y="1472" font-size="23" fill="#111827" font-weight="700">판정은 산문이 아니라 스키마다</text>
<text x="906.0" y="1520" font-size="19" fill="#6B7280">기권·적용 판단을 structured outputs로 받아 시스템이 읽는다.</text>
<text x="906.0" y="1552" font-size="19" fill="#6B7280">flag-first 필드 순서가 계약이라 증분 파서가 플래그를</text>
<text x="906.0" y="1584" font-size="19" fill="#6B7280">본문보다 먼저 읽고, TTFT는 구조화 이전과 같다.</text>
<rect x="1704.0" y="1420" width="800.0" height="200" rx="20" fill="white" stroke="#D1D5DB"/>
<rect x="1704.0" y="1448" width="6" height="30" rx="3" fill="#334155"/>
<text x="1730.0" y="1472" font-size="23" fill="#111827" font-weight="700">집행은 프롬프트 밖에 둔다</text>
<text x="1730.0" y="1520" font-size="19" fill="#6B7280">3값 판정은 도메인 검증기가, 기권 문구는 코드 템플릿이,</text>
<text x="1730.0" y="1552" font-size="19" fill="#6B7280">인용은 본문에 등장한 마커만 영속화가 강제한다.</text>
<text x="1730.0" y="1584" font-size="19" fill="#6B7280">프롬프트가 어긋나면 폴백률이 튀어 관측에 잡힌다.</text>
