<text x="1516" y="600" font-size="19" fill="#6B7280">거부 산문 대신 판정으로</text>
<text x="1516" y="630" font-size="19" fill="#6B7280">비교·다면은 기권이 아니다</text>
<text x="1516" y="682" font-size="21" fill="#111827" font-weight="600">flag-first 스키마</text>
<text x="1516" y="712" font-size="19" fill="#6B7280">필드 선언 순서가 계약</text>
