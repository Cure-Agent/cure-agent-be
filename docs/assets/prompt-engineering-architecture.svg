<text x="1874" y="600" font-size="19" fill="#6B7280">근거 마커 + 프로필 필드</text>
<text x="1874" y="630" font-size="19" fill="#6B7280">두 다리 없으면 폐기</text>
<text x="1874" y="682" font-size="21" fill="#111827" font-weight="600">규칙 4 · 5</text>
<text x="1874" y="712" font-size="19" fill="#6B7280">3값 판정 · 수치 계산 금지</text>
