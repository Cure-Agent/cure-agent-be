map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 에이전트 경로의 Cookie 재작성 (docs/specs/49) — access_token 하나만 넘긴다.
# refresh는 FE가 경로와 무관하게 전담하므로 에이전트에는 쓸모가 없고, 에이전트가 쓰면 회전으로
# 브라우저의 refresh가 구 토큰이 되어 다음 FE refresh가 재사용 감지 → family 폐기(로그아웃)가 된다.
# 14일 수명 토큰이 에이전트 프로세스에 도달조차 하지 않게 여기서 거른다.
# access가 없으면 빈 값이 되고, nginx는 빈 proxy_set_header를 보내지 않아 Cookie 헤더 자체가 빠진다.
map $cookie_access_token $agent_cookie {
    ''      '';
    default "access_token=$cookie_access_token";
}

limit_req_zone  $binary_remote_addr zone=api_limit:10m  rate=30r/s;
limit_req_zone  $binary_remote_addr zone=auth_limit:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;
limit_req_status  429;
limit_conn_status 429;

server {
    listen 80;
    server_name api.cure.demo01.xyz;

    # Let's Encrypt 인증서 발급/갱신용 webroot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 나머지 HTTP 요청은 HTTPS로 리다이렉트
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.cure.demo01.xyz;

    # 단일 인증서가 api + grafana 두 도메인을 커버한다 (certbot -d api -d grafana)
    ssl_certificate     /etc/letsencrypt/live/api.cure.demo01.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.cure.demo01.xyz/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── 알려진 취약점 스캔 경로 차단 (PHPUnit, ThinkPHP, WordPress 등) ──
    location ~* (eval-stdin\.php|invokefunction|call_user_func_array|\.env$|wp-login|wp-admin|phpinfo|phpmyadmin|\.git|\.svn) {
        access_log off;
        return 444;
    }

    # ── PHP/ASP/CGI 등 비관련 확장자 차단 ──
    location ~* \.(php|asp|aspx|jsp|cgi|pl)$ {
        access_log off;
        return 444;
    }

    # ── 악성 봇 User-Agent 차단 ──
    if ($http_user_agent ~* (zgrab|nuclei|masscan|nmap|nikto|sqlmap|dirbuster|gobuster|scanner)) {
        return 444;
    }

    # ── Prometheus 스크레이프 엔드포인트 차단 ──
    # alloy는 compose 내부망(app:3000)에서 직접 긁는다. 외부에는 존재를 드러내지 않는다 —
    # 라우트 목록·트래픽량·토큰 소비량이 그대로 노출되기 때문이다.
    location = /api/v1/metrics {
        return 404;
    }

    # 인증 엔드포인트 — 무차별 대입 방어용 저율 제한
    location ^~ /api/v1/auth/ {
        limit_req zone=auth_limit burst=20 nodelay;

        proxy_pass         http://app:3000;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # 에이전트 서비스 (docs/specs/49) — 브라우저에게는 /api/v1 하나이고 분기는 여기서 한다.
    # 경계는 끝 슬래시다(/api/v1/agentx/…는 아래 일반 API로 간다).
    #
    # **요청 시점 해석** — 정적 proxy_pass면 agent 컨테이너가 없거나 재시작 중일 때 nginx가
    # `host not found in upstream`으로 기동하지 못해 BE까지 전면 장애가 된다. 변수로 넘기면 해석이
    # 요청 시점(Docker 내장 DNS)으로 미뤄져 에이전트 부재가 이 경로의 502로 격리되고, 에이전트가
    # 다시 뜨면 nginx 재시작 없이 붙는다. valid=10s라 재생성 직후 최대 10초는 502일 수 있다.
    # app은 정적 그대로 둔다 — 핵심 의존이라 결합이 곧 사실이다.
    # 요청 제한·타임아웃·버퍼링은 일반 API location과 같다.
    location ^~ /api/v1/agent/ {
        limit_req  zone=api_limit  burst=50 nodelay;
        limit_conn conn_limit 30;

        resolver         127.0.0.11 valid=10s ipv6=off;
        resolver_timeout 5s;
        set $agent_upstream http://agent:8000;
        # URI 부분을 붙이지 않는다 — 변수 proxy_pass에 URI가 있으면 요청 URI가 통째로 그 값으로 바뀐다
        proxy_pass         $agent_upstream;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        # 위 map이 만든 access_token 하나로 대체한다. X-CSRF-Protection은 손대지 않는다 —
        # 받은 그대로 넘기고 없으면 없는 채로 둔다(여기서 붙이면 CSRF 가드가 무력해진다)
        proxy_set_header   Cookie            $agent_cookie;

        proxy_buffering    off;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    300s;
    }

    # 일반 API — LLM 응답이 길 수 있어 read timeout을 넉넉히 두고
    # 스트리밍 응답 대비 버퍼링을 끈다
    location / {
        limit_req  zone=api_limit  burst=50 nodelay;
        limit_conn conn_limit 30;

        proxy_pass         http://app:3000;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;

        # WebSocket support
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;

        proxy_buffering    off;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    300s;
    }
}
