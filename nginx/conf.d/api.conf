map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

limit_req_zone  $binary_remote_addr zone=api_limit:10m  rate=30r/s;
limit_req_zone  $binary_remote_addr zone=auth_limit:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;
limit_req_status  429;
limit_conn_status 429;

server {
    listen 80;
    server_name api.cure.demo01.xyz;

    # Let's Encrypt 인증서 발급/갱신용 webroot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 나머지 HTTP 요청은 HTTPS로 리다이렉트
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.cure.demo01.xyz;

    # 단일 인증서가 api + grafana 두 도메인을 커버한다 (certbot -d api -d grafana)
    ssl_certificate     /etc/letsencrypt/live/api.cure.demo01.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.cure.demo01.xyz/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── 알려진 취약점 스캔 경로 차단 (PHPUnit, ThinkPHP, WordPress 등) ──
    location ~* (eval-stdin\.php|invokefunction|call_user_func_array|\.env$|wp-login|wp-admin|phpinfo|phpmyadmin|\.git|\.svn) {
        access_log off;
        return 444;
    }

    # ── PHP/ASP/CGI 등 비관련 확장자 차단 ──
    location ~* \.(php|asp|aspx|jsp|cgi|pl)$ {
        access_log off;
        return 444;
    }

    # ── 악성 봇 User-Agent 차단 ──
    if ($http_user_agent ~* (zgrab|nuclei|masscan|nmap|nikto|sqlmap|dirbuster|gobuster|scanner)) {
        return 444;
    }

    # 인증 엔드포인트 — 무차별 대입 방어용 저율 제한
    location ^~ /api/v1/auth/ {
        limit_req zone=auth_limit burst=20 nodelay;

        proxy_pass         http://app:3000;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # 일반 API — LLM 응답이 길 수 있어 read timeout을 넉넉히 두고
    # 스트리밍 응답 대비 버퍼링을 끈다
    location / {
        limit_req  zone=api_limit  burst=50 nodelay;
        limit_conn conn_limit 30;

        proxy_pass         http://app:3000;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;

        # WebSocket support
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;

        proxy_buffering    off;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    300s;
    }
}
