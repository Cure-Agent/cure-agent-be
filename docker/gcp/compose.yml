# GCP e2-standard-2(2vCPU/8GB) 단일 서버 통합 구성 (배포 계획 v2)
# 외부 노출은 nginx(80/443)만 — 나머지는 전부 compose 내부 네트워크 통신.
# 메모리 배분(mem_limit 합 ≈ 5.9G / 8G): app 2G, postgres 1.5G, redis 512M,
# 모니터링 스택 ≈ 1.8G, nginx·certbot 여유분.
services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: cure-postgres
    restart: always
    mem_limit: 1536m
    environment:
      POSTGRES_USER: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: cure_agent
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d cure_agent']
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - cure-backend

  redis:
    image: redis:7-alpine
    container_name: cure-redis
    restart: unless-stopped
    mem_limit: 512m
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    command: >
      redis-server --appendonly yes
                   --bind 0.0.0.0
                   --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$REDIS_PASSWORD\" ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    networks:
      - cure-backend

  app:
    image: ghcr.io/cure-agent/cure-agent-app:${APP_IMAGE_TAG:-latest}
    container_name: cure-app
    restart: unless-stopped
    mem_limit: 2g
    environment:
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USERNAME}:${POSTGRES_PASSWORD}@postgres:5432/cure_agent
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      AUTH_ACCESS_TTL_SEC: ${AUTH_ACCESS_TTL_SEC:-900}
      AUTH_REFRESH_TTL_DAYS: ${AUTH_REFRESH_TTL_DAYS:-14}
      COOKIE_SECURE: 'true'
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      # 소셜 로그인 (docs/specs/17). OAUTH_WEB_BASE_URL은 FE 오리진이다 —
      # 콜백이 FE의 Next rewrites를 경유해야 쿠키가 FE와 same-origin으로 저장된다.
      OAUTH_WEB_BASE_URL: ${OAUTH_WEB_BASE_URL}
      OAUTH_TICKET_TTL_SEC: ${OAUTH_TICKET_TTL_SEC:-600}
      OAUTH_STATE_TTL_SEC: ${OAUTH_STATE_TTL_SEC:-600}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:-}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID:-}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET:-}
      CRYPTO_ENC_KEYS: ${CRYPTO_ENC_KEYS}
      CRYPTO_ENC_ACTIVE_VERSION: ${CRYPTO_ENC_ACTIVE_VERSION:-v1}
      CRYPTO_HMAC_INDEX_KEY: ${CRYPTO_HMAC_INDEX_KEY}
      ALERT_WEBHOOK_URLS: ${ALERT_WEBHOOK_URLS:-}
      # 지침 개정 감지 스케줄러 (docs/specs/26). 앱 기본값은 꺼짐이라 **여기서 명시적으로 켠다** —
      # 크론식은 프로세스 TZ 기준이고 이 컨테이너에는 TZ가 없어 UTC다(0 19 * * * = 04:00 KST).
      GUIDELINE_REVISION_SCAN_ENABLED: ${GUIDELINE_REVISION_SCAN_ENABLED:-true}
      GUIDELINE_REVISION_SCAN_CRON: ${GUIDELINE_REVISION_SCAN_CRON:-0 19 * * *}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-1024}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # readiness — DB·Redis 준비까지 확인한다 (docs/specs/16)
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - cure-backend
      - cure-proxy

  nginx:
    image: nginx:alpine
    container_name: cure-nginx
    restart: unless-stopped
    mem_limit: 64m
    entrypoint: /docker-entrypoint-custom.sh
    environment:
      # 인증서 디렉토리 기준 도메인 — certbot이 -d api -d grafana 순으로 발급하므로
      # live/<api 도메인>/ 아래 단일 인증서(SAN에 grafana 포함)가 생긴다
      NGINX_DOMAIN: api.cure.demo01.xyz
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ../../nginx/docker-entrypoint.sh:/docker-entrypoint-custom.sh:ro
      - ../../nginx/conf.d/api.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../nginx/conf.d/grafana.conf:/etc/nginx/conf.d/grafana.conf:ro
      - ../../letsencrypt:/etc/letsencrypt
      - ../../certbot/www:/var/www/certbot:ro
    depends_on:
      - app
      - grafana
    networks:
      - cure-proxy

  # 최초 인증서 발급 (한 번 실행 후 종료) — api + grafana 두 도메인을 단일 인증서로 커버
  certbot-init:
    image: certbot/certbot:v5.5.0
    container_name: cure-certbot-init
    mem_limit: 64m
    volumes:
      - ../../letsencrypt:/etc/letsencrypt
      - ../../certbot/www:/var/www/certbot
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ -d /etc/letsencrypt/renewal ] && [ "$$(ls -A /etc/letsencrypt/renewal 2>/dev/null)" ]; then
          echo '[certbot-init] Certificates already exist. Skipping.'
          exit 0
        fi

        echo '[certbot-init] Waiting for nginx to be ready...'
        TRIES=0
        until wget -q --spider http://nginx:80/.well-known/acme-challenge/ 2>/dev/null || [ "$$TRIES" -ge 30 ]; do
          TRIES=$$((TRIES + 1))
          sleep 2
        done

        echo '[certbot-init] Requesting initial certificate...'
        rm -rf /etc/letsencrypt/live/api.cure.demo01.xyz
        rm -rf /etc/letsencrypt/archive/api.cure.demo01.xyz
        if certbot certonly --webroot --webroot-path=/var/www/certbot \
          -d api.cure.demo01.xyz \
          -d grafana.cure.demo01.xyz \
          --email ${CERTBOT_EMAIL} \
          --agree-tos --non-interactive; then
          echo '[certbot-init] Certificate issued successfully.'
        else
          echo '[certbot-init] WARNING: certbot failed. Nginx will continue with the dummy certificate.'
          echo '[certbot-init] The renewal service will retry later.'
        fi
    depends_on:
      - nginx
    networks:
      - cure-proxy

  # 12시간마다 인증서 갱신 시도 (nginx는 엔트리포인트가 주기적으로 reload)
  certbot:
    image: certbot/certbot:v5.5.0
    container_name: cure-certbot
    restart: unless-stopped
    mem_limit: 64m
    volumes:
      - ../../letsencrypt:/etc/letsencrypt
      - ../../certbot/www:/var/www/certbot
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done"
    depends_on:
      - nginx

  alloy:
    image: grafana/alloy:v1.9.0
    container_name: cure-alloy
    restart: unless-stopped
    mem_limit: 384m
    privileged: true
    pid: host
    command:
      - run
      - /etc/alloy/config.alloy
      - --stability.level=generally-available
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
      - /:/rootfs:ro,rslave
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /var/log:/var/log:ro
    depends_on:
      - prometheus
      - loki
    networks:
      # app(/metrics)과 DB·Redis exporter를 긁으려면 backend 망에도 붙어야 한다.
      # 반대 방향(app을 monitoring 망에 넣기)은 외부 트래픽을 받는 app에
      # 모니터링 스택 접근 권한을 주게 되므로 택하지 않는다.
      - cure-monitoring
      - cure-backend

  # ── 데이터스토어 exporter — 로그만으로는 보이지 않는 커넥션·캐시 상태를 노출한다 ──
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    container_name: cure-postgres-exporter
    restart: unless-stopped
    mem_limit: 64m
    environment:
      DATA_SOURCE_NAME: postgres://${POSTGRES_USERNAME}:${POSTGRES_PASSWORD}@postgres:5432/cure_agent?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cure-backend

  redis-exporter:
    image: oliver006/redis_exporter:v1.88.0-alpine
    container_name: cure-redis-exporter
    restart: unless-stopped
    mem_limit: 64m
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - cure-backend

  prometheus:
    image: prom/prometheus:v3.11.2
    container_name: cure-prometheus
    restart: unless-stopped
    mem_limit: 512m
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      # alloy가 메트릭을 push하는 수신 엔드포인트 (/api/v1/write)
      - '--web.enable-remote-write-receiver'
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    networks:
      - cure-monitoring

  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: cure-alertmanager
    restart: unless-stopped
    mem_limit: 128m
    environment:
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL}
    entrypoint:
      - /bin/sh
      - -c
      - |
        sed \
          -e "s|\$${DISCORD_WEBHOOK_URL}|$$DISCORD_WEBHOOK_URL|g" \
          /etc/alertmanager/alertmanager.yml.tpl > /tmp/alertmanager.yml
        exec /bin/alertmanager --config.file=/tmp/alertmanager.yml --storage.path=/alertmanager
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml.tpl:ro
      - alertmanager-data:/alertmanager
    networks:
      - cure-monitoring

  loki:
    image: grafana/loki:3.6.7
    container_name: cure-loki
    restart: unless-stopped
    mem_limit: 384m
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./monitoring/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    networks:
      - cure-monitoring

  grafana:
    image: grafana/grafana:12.4.2
    container_name: cure-grafana
    restart: unless-stopped
    mem_limit: 384m
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: https://grafana.cure.demo01.xyz
      GF_SERVER_SERVE_FROM_SUB_PATH: 'false'
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    networks:
      - cure-monitoring
      - cure-proxy

volumes:
  postgres-data:
  redis-data:
  alloy-data:
  prometheus-data:
  alertmanager-data:
  loki-data:
  grafana-data:

networks:
  cure-backend:
    driver: bridge
  cure-proxy:
    driver: bridge
  cure-monitoring:
    driver: bridge
