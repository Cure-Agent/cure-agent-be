apiVersion: 1

# uid는 대시보드 JSON이 참조하는 키다 — 고정하지 않으면 grafana-data 볼륨 재생성 시
# 새 uid가 발급되어 프로비저닝된 대시보드가 전부 "datasource not found"로 깨진다.
#
# deleteDatasources가 필요한 이유: Grafana는 이미 존재하는 데이터소스를 name으로 찾아
# update하는데, 이 경로에서 uid 변경은 지원되지 않는다. 자동 발급 uid로 만들어진
# 기존 데이터소스에 uid를 뒤늦게 붙이면 "Datasource provisioning error: data source
# not found"가 나면서 grafana 부팅 자체가 실패한다(크래시 루프).
# name 기준으로 먼저 삭제해 insert 경로를 타게 해야 uid가 확정된다.
# 삭제 대상이 없는 신규 서버에서는 no-op이라 남겨둬도 무해하다.
deleteDatasources:
  - name: Prometheus
    orgId: 1
  - name: Loki
    orgId: 1

datasources:
  - name: Prometheus
    uid: cure-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  - name: Loki
    uid: cure-loki
    type: loki
    access: proxy
    url: http://loki:3100
