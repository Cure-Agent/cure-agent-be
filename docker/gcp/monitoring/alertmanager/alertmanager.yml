# ${DISCORD_WEBHOOK_URL}은 compose entrypoint의 sed가 실제 값으로 치환한다 (템플릿)
global:
  resolve_timeout: 5m

route:
  receiver: discord
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - match:
        severity: critical
      receiver: discord
      repeat_interval: 1h

receivers:
  - name: discord
    discord_configs:
      - webhook_url: '${DISCORD_WEBHOOK_URL}'
        send_resolved: true
        message: |
          [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.alertname }}
          {{ range .Alerts -}}
          - {{ .Annotations.summary }} (severity={{ .Labels.severity }})
            {{ .Annotations.description }}
          {{ end }}
