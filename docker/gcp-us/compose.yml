# GCP e2-micro(2 vCPU 공유/1GB) 무료 등급 단일 서버 — 서울(docker/gcp)에서 모니터링 스택을 뺀 구성.
# 체험 종료에 대비한 병행 환경이다(terraform/gcp-us/README.md). 병행 기간에 서울 compose를 고치면 여기에도 옮긴다.
# 외부 노출은 nginx(80/443)만 — 나머지는 전부 compose 내부 네트워크 통신.
#
# 모니터링 7종(alloy·postgres/redis exporter·prometheus·alertmanager·loki·grafana)은 서울 실측 ≈600MiB로
# 1GB에 들지 않아 뺐다. 그래서 nginx에 grafana.conf를 마운트하지 않는다 — 정적 upstream(grafana:3000)이라
# grafana가 없으면 nginx가 기동하지 못한다.
#
# 메모리: mem_limit은 폭주한 컨테이너 하나를 가두는 상한이지 배분이 아니다 — 합(≈1.2G)이 물리 메모리를 넘는다.
# 서울 실측(2026-10-06)으로 이 구성의 실사용은 ≈340MiB, 기동 이후 최대치는 app 220·agent 137·postgres 269MiB
# (페이지 캐시 포함)라 상한을 그 위에 둔다. 1GB에 들어가는지는 이 서버에서 다시 잰다.
services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: cure-postgres
    restart: always
    # shared_buffers 128MB(기본값) + 커넥션(app 풀 기본 10개) 몫. 넘는 페이지 캐시는 상한에서 회수된다
    mem_limit: 320m
    environment:
      POSTGRES_USER: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: cure_agent
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d cure_agent']
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - cure-backend

  redis:
    image: redis:7-alpine
    container_name: cure-redis
    restart: unless-stopped
    # 락·로그아웃 거부 목록·OAuth 티켓뿐이고 전부 TTL로 만료된다
    mem_limit: 64m
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    command: >
      redis-server --appendonly yes
                   --bind 0.0.0.0
                   --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$REDIS_PASSWORD\" ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    networks:
      - cure-backend

  app:
    image: ghcr.io/cure-agent/cure-agent-app:${APP_IMAGE_TAG:-latest}
    container_name: cure-app
    restart: unless-stopped
    mem_limit: 384m
    environment:
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USERNAME}:${POSTGRES_PASSWORD}@postgres:5432/cure_agent
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      AUTH_ACCESS_TTL_SEC: ${AUTH_ACCESS_TTL_SEC:-900}
      AUTH_REFRESH_TTL_DAYS: ${AUTH_REFRESH_TTL_DAYS:-14}
      COOKIE_SECURE: 'true'
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      # 소셜 로그인 (docs/specs/17). OAUTH_WEB_BASE_URL은 FE 오리진이다 —
      # 콜백이 FE의 Next rewrites를 경유해야 쿠키가 FE와 same-origin으로 저장된다.
      OAUTH_WEB_BASE_URL: ${OAUTH_WEB_BASE_URL}
      OAUTH_TICKET_TTL_SEC: ${OAUTH_TICKET_TTL_SEC:-600}
      OAUTH_STATE_TTL_SEC: ${OAUTH_STATE_TTL_SEC:-600}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:-}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID:-}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET:-}
      CRYPTO_ENC_KEYS: ${CRYPTO_ENC_KEYS}
      CRYPTO_ENC_ACTIVE_VERSION: ${CRYPTO_ENC_ACTIVE_VERSION:-v1}
      CRYPTO_HMAC_INDEX_KEY: ${CRYPTO_HMAC_INDEX_KEY}
      ALERT_WEBHOOK_URLS: ${ALERT_WEBHOOK_URLS:-}
      # 지침 개정 감지 스케줄러 (docs/specs/26). 앱 기본값은 꺼짐이라 **여기서 명시적으로 켠다** —
      # 크론식은 프로세스 TZ 기준이고 이 컨테이너에는 TZ가 없어 UTC다(0 19 * * * = 04:00 KST).
      GUIDELINE_REVISION_SCAN_ENABLED: ${GUIDELINE_REVISION_SCAN_ENABLED:-true}
      GUIDELINE_REVISION_SCAN_CRON: ${GUIDELINE_REVISION_SCAN_CRON:-0 19 * * *}
      # 소프트 삭제분 파기 스케줄러 (docs/specs/34). 앱 기본값은 꺼짐이라 여기서 켠다 —
      # 0 18 * * * = 03:00 KST로, 개정 스캔(04:00 KST)과 겹치지 않는다.
      # 유예를 줄이려면 DATA_PURGE_RETENTION_DAYS만 바꾼다(법무 판단이 바뀌어도 코드는 그대로).
      DATA_PURGE_ENABLED: ${DATA_PURGE_ENABLED:-true}
      DATA_PURGE_CRON: ${DATA_PURGE_CRON:-0 18 * * *}
      DATA_PURGE_RETENTION_DAYS: ${DATA_PURGE_RETENTION_DAYS:-30}
      # refresh 세션 유예 (docs/specs/39) — 임상 데이터 유예와 **별도 축**이라 함께 움직이면
      # 안 된다. 만료된 토큰은 이미 교환이 거부되므로 이 값은 재사용 감지 꼬리의 길이다.
      DATA_PURGE_SESSION_RETENTION_DAYS: ${DATA_PURGE_SESSION_RETENTION_DAYS:-30}
      DATA_PURGE_BATCH_SIZE: ${DATA_PURGE_BATCH_SIZE:-200}
      # 한 틱에서 돌 배치 수 상한 (이슈 #473). 배치가 꽉 차면 이어 돌므로 틱당 처리량은
      # BATCH_SIZE × 이 값이다 — 200 × 50 = 축당 10,000건.
      DATA_PURGE_MAX_BATCHES_PER_TICK: ${DATA_PURGE_MAX_BATCHES_PER_TICK:-50}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # 참고안 구조화 킬스위치 (docs/specs/33 기준 8). 'false'만 발동한다.
      # OPENAI_API_KEY를 비우는 방식으로는 끌 수 없다 — 그 키는 메인 LLM과 공유라 답변이 죽는다.
      GUIDANCE_STRUCTURE_ENABLED: ${GUIDANCE_STRUCTURE_ENABLED:-}
      # ⚠️ LLM 튜닝값의 기본값은 llm.config.ts DEFAULTS가 단독으로 소유한다.
      # 여기에 기본값을 적어두면 코드가 올라가도 컨테이너는 옛 값을 받는다 —
      # 실제로 LLM_MAX_OUTPUT_TOKENS를 `:-1024`로 박아둔 탓에 코드의 4096 상향이 무효였다.
      # 빈 값은 코드 기본값으로 떨어지므로(nonEmpty/positiveInt) 통과만 시킨다.
      # 환경별로 덮어쓸 때만 값을 채우고, cd-gcp-us.yml의 env·envs 목록에도 함께 추가한다.
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_REASONING_EFFORT: ${OPENAI_REASONING_EFFORT:-}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-}
      RETRIEVAL_DISTANCE_CUTOFF: ${RETRIEVAL_DISTANCE_CUTOFF:-}
      RETRIEVAL_RERANK_ENABLED: ${RETRIEVAL_RERANK_ENABLED:-}
      RETRIEVAL_RERANK_CANDIDATES: ${RETRIEVAL_RERANK_CANDIDATES:-}
      RETRIEVAL_RERANK_SCORE_CUTOFF: ${RETRIEVAL_RERANK_SCORE_CUTOFF:-}
      RETRIEVAL_HYBRID_ENABLED: ${RETRIEVAL_HYBRID_ENABLED:-}
      # 키워드 arm 후보 프리필터 (docs/specs/45·48). 'false'만 발동하고, 빈 값은 코드 기본값(켜짐)이다.
      # 후보 예산도 빈 값이면 코드 기본값 75다 — compose는 통로일 뿐 기본값을 갖지 않는다(#156).
      RETRIEVAL_VOCAB_PREFILTER_ENABLED: ${RETRIEVAL_VOCAB_PREFILTER_ENABLED:-}
      RETRIEVAL_KEYWORD_CANDIDATE_BUDGET: ${RETRIEVAL_KEYWORD_CANDIDATE_BUDGET:-}
      # 답변가능성 게이트 킬스위치 (docs/specs/40). 'false'만 발동하고, 빈 값은 코드 기본값(켜짐)이다.
      LLM_ANSWERABILITY_GATE_ENABLED: ${LLM_ANSWERABILITY_GATE_ENABLED:-}
      # 데모 환자 시딩. 위와 방향이 반대다 — 'true'만 발동하고 빈 값은 꺼짐(코드 기본값)이다.
      DEMO_SEED_ENABLED: ${DEMO_SEED_ENABLED:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # readiness — DB·Redis 준비까지 확인한다 (docs/specs/16)
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - cure-backend
      - cure-proxy

  # 에이전트 서비스 (docs/specs/49) — 판단만 하고 데이터·권한은 BE API에 둔다.
  # **cure-proxy 망에만 붙는다** — DB·Redis로 가는 경로 자체가 없어야 원칙이 구조로 선다.
  # BE는 내부 주소로 부른다: 공개 주소로 돌면 nginx를 한 번 더 지나며 auth_limit(5r/s)을 모든
  # 사용자가 에이전트 IP 하나로 나눠 쓴다.
  # 운영 추적 통로는 환자·복합 분기 뒤 입출력 숨김과 같은 스텝(docs/specs/51)에서 열었다 — 켜는 수단과
  # 숨기는 수단이 같은 날 생긴다. 기본 꺼짐이고 켜는 수단은 앱 스위치(AGENT_TRACING_ENABLED) 하나다.
  # nginx.depends_on에 넣지 않는다 — nginx가 요청 시점에 agent를 해석하므로 기동 순서로도 결합하지 않는다.
  agent:
    image: ghcr.io/cure-agent/medical-agentic-rag:${AGENT_IMAGE_TAG:-latest}
    container_name: cure-agent
    restart: unless-stopped
    mem_limit: 256m
    environment:
      BE_ORIGIN: http://app:3000
      # 분류·합성 LLM (docs/specs/51) — BE와 같은 시크릿이다. 키를 나누면 로테이션 지점만 둘이 된다
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # 추적 스위치 — `true`만 발동한다(§49). CD가 저장소 변수에서 넘기고, 미설정이면 빈 값이라 꺼져 있다.
      # SDK 스위치(LANGSMITH_TRACING·LANGCHAIN_TRACING_V2)는 싣지 않는다 — `true` 한 줄로 켜지고 `false`로
      # 끌 수 없어 앱 스위치를 우회하는 두 번째 수단이 된다(langsmith 0.11.0 실측, §49).
      AGENT_TRACING_ENABLED: ${AGENT_TRACING_ENABLED:-}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
    healthcheck:
      # liveness — 프로세스 생존만 본다(healthz는 BE를 부르지 않는다). 이미지에 curl이 없어 python으로 본다.
      # urlopen은 2xx가 아니거나 연결이 안 되면 예외로 끝나 exit 1이 된다.
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/agent/healthz', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    networks:
      - cure-proxy

  nginx:
    image: nginx:alpine
    container_name: cure-nginx
    restart: unless-stopped
    mem_limit: 64m
    entrypoint: /docker-entrypoint-custom.sh
    environment:
      # 인증서 디렉토리 기준 도메인 — live/<api 도메인>/ 아래 인증서를 쓴다.
      # 전환 전에는 서울에서 복사한 인증서(SAN에 grafana 포함)이고, 전환 뒤 api 단독으로 재발급한다
      NGINX_DOMAIN: api.cure.demo01.xyz
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ../../nginx/docker-entrypoint.sh:/docker-entrypoint-custom.sh:ro
      - ../../nginx/conf.d/api.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../letsencrypt:/etc/letsencrypt
      - ../../certbot/www:/var/www/certbot:ro
    depends_on:
      - app
    networks:
      - cure-proxy

  # 최초 인증서 발급 (한 번 실행 후 종료) — api 하나만 발급한다(grafana가 없다)
  # 서울에서 복사한 letsencrypt/가 있으면 건너뛴다. **첫 배포 전에 복사해야 한다** — DNS가 아직 서울을
  # 가리키면 발급이 실패하는데, 그 전에 아래 rm이 nginx의 더미 인증서를 지워 배포의 `nginx -t`가 깨진다.
  certbot-init:
    image: certbot/certbot:v5.5.0
    container_name: cure-certbot-init
    mem_limit: 64m
    volumes:
      - ../../letsencrypt:/etc/letsencrypt
      - ../../certbot/www:/var/www/certbot
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ -d /etc/letsencrypt/renewal ] && [ "$$(ls -A /etc/letsencrypt/renewal 2>/dev/null)" ]; then
          echo '[certbot-init] Certificates already exist. Skipping.'
          exit 0
        fi

        echo '[certbot-init] Waiting for nginx to be ready...'
        TRIES=0
        until wget -q --spider http://nginx:80/.well-known/acme-challenge/ 2>/dev/null || [ "$$TRIES" -ge 30 ]; do
          TRIES=$$((TRIES + 1))
          sleep 2
        done

        echo '[certbot-init] Requesting initial certificate...'
        rm -rf /etc/letsencrypt/live/api.cure.demo01.xyz
        rm -rf /etc/letsencrypt/archive/api.cure.demo01.xyz
        if certbot certonly --webroot --webroot-path=/var/www/certbot \
          -d api.cure.demo01.xyz \
          --email ${CERTBOT_EMAIL} \
          --agree-tos --non-interactive; then
          echo '[certbot-init] Certificate issued successfully.'
        else
          echo '[certbot-init] WARNING: certbot failed. Nginx will continue with the dummy certificate.'
          echo '[certbot-init] The renewal service will retry later.'
        fi
    depends_on:
      - nginx
    networks:
      - cure-proxy

  # 12시간마다 인증서 갱신 시도 (nginx는 엔트리포인트가 주기적으로 reload)
  certbot:
    image: certbot/certbot:v5.5.0
    container_name: cure-certbot
    restart: unless-stopped
    mem_limit: 64m
    volumes:
      - ../../letsencrypt:/etc/letsencrypt
      - ../../certbot/www:/var/www/certbot
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done"
    depends_on:
      - nginx

volumes:
  postgres-data:
  redis-data:

networks:
  cure-backend:
    driver: bridge
  cure-proxy:
    driver: bridge
